services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - bot-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
volumes:
  bot-data:
