name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q bot scripts
      - run: bash -n install.sh
      - run: bash tests/test_installer.sh
      - run: bash -n scripts/mhx.sh
      - run: bash tests/test_update.sh
      - run: docker build -t hetzner-manager-test .
      - name: Smoke test chart rendering in the read-only image
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:size=16m
          hetzner-manager-test python -c "from bot.graphs import render_chart; from bot.main import Manager; assert render_chart('cpu', {'time_series': {'cpu': {'values': [[1, '1'], [61, '2']]}}}).startswith(bytes([137, 80, 78, 71]))"
